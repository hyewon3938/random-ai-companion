# main으로 푸시할 때와 PR을 열 때 타입 검사와 단위 테스트를 돌린다.
# 모델을 부르는 검사(yarn eval)는 API 키가 필요하고 호출당 비용이 들어서 여기서 돌리지 않는다.
name: 검사

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 검사와 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 배포 이미지(Dockerfile)와 같은 버전으로 맞춘다.
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
